<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetMate Payment Canceled</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff8e7;
        color: #3e2723;
      }
      .card {
        width: min(420px, 92vw);
        background: white;
        border: 3px solid #d8c38f;
        border-radius: 20px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      }
      h1 { margin-top: 0; }
      p { line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>❌ Payment Canceled</h1>
      <p>No charge was made.</p>
      <p>You can return to LeetMate and try again anytime.</p>
    </div>
  </body>
</html>
