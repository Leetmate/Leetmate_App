<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Settings</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="../menu/nav.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="settings-card">
          <div class="settings-header">
            <button type="button" class="settings-back-btn">
              ◀ Back
            </button>
            <h1 class="settings-title-main">Settings</h1>
            <button type="button" class="menu-btn nav-trigger" id="nav-trigger" aria-expanded="false" aria-controls="nav-drawer" aria-label="Open menu">☰</button>
          </div>
          
          <div class="settings-content">
            <div class="settings-section">
              <h2 class="settings-section-title">Account Details</h2>
              <p style="margin: 0; font-size: 14px;">Email: [User Email]</p>
            </div>
            
            <button type="button" class="settings-btn-primary settings-btn-danger" id="signout-btn">
              Sign Out
            </button>
          </div>
        </div>
      </div>

      <div class="nav-overlay" id="nav-overlay" aria-hidden="true">
        <div class="nav-drawer" id="nav-drawer" role="dialog" aria-modal="true" aria-label="Main menu">
          <button type="button" class="nav-close-btn" id="nav-close" aria-label="Close menu">×</button>
          <nav class="nav-menu" id="nav-menu">
            <button type="button" class="nav-menu-btn">Home</button>
            <button type="button" class="nav-menu-btn">Playground</button>
            <button type="button" class="nav-menu-btn">Store</button>
            <button type="button" class="nav-menu-btn">Community</button>
            <button type="button" class="nav-menu-btn">Activity</button>
            <button type="button" class="nav-menu-btn">Settings</button>
          </nav>
        </div>
      </div>
    </div>

    <script src="../menu/nav.js"></script>
    <script src="../../firebase-bundle.js"></script>
    <script src="../../firebase-config.js"></script>
    <!-- 
      REQUIRE LOGIN TO VIEW THIS SCREEN:
      Including auth-gate.js ensures only signed-in users can access this page.
    -->
    <script src="../../scripts/auth-gate.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
