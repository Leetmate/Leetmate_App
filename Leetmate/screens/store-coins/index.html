<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leetmate - Coin Shop</title>
  <link rel="stylesheet" href="../../styles/layout.css">
  <link rel="stylesheet" href="store-coins.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body class="hidden-on-load">
  <div class="shop-container">
    <!-- Header with Back Button -->
    <header class="shop-header">
      <div class="header-left">
        <button class="back-btn stone-btn" id="back-btn" title="Back to Store">
          <span class="arrow-icon"></span>
        </button>
      </div>
      <h1 class="shop-title">Coin Shop</h1>
      <div class="header-right">
        <div class="coins-display">
          <img src="../../assets/icons/coin.png" class="coin-icon" alt="Coins" />
          <span id="coin-count">--</span>
        </div>
      </div>
    </header>

    <!-- Main Shop Box -->
    <main class="shop-box">
      <!-- Tier 1 -->
      <section class="tier-section">
        <div class="tier-content">
          <h2 class="tier-label">50 coins</h2>
          <div class="tier-icon-wrap">
            <img src="../../assets/icons/Stack of coins (50).png" class="tier-img" alt="50 coins">
          </div>
        </div>
        <div class="tier-action">
          <button class="price-btn shiny-btn" data-amount="50">0.99$</button>
        </div>
      </section>

      <!-- Tier 2 -->
      <section class="tier-section">
        <div class="tier-content">
          <h2 class="tier-label">150 coins</h2>
          <div class="tier-icon-wrap multi-stack">
            <img src="../../assets/icons/Stack of coins (50).png" class="tier-img" alt="">
            <img src="../../assets/icons/Stack of coins (50).png" class="tier-img" alt="150 coins">
          </div>
        </div>
        <div class="tier-action">
          <button class="price-btn shiny-btn" data-amount="150">1.99$</button>
        </div>
      </section>

      <!-- Tier 3 -->
      <section class="tier-section">
        <div class="tier-content">
          <h2 class="tier-label">500 coins</h2>
          <div class="tier-icon-wrap">
            <img src="../../assets/icons/Treasure chest (500).png" class="tier-img" alt="500 coins">
          </div>
        </div>
        <div class="tier-action">
          <button class="price-btn shiny-btn" data-amount="500">4.99$</button>
        </div>
      </section>
    </main>

    <!-- Decorative Sprites -->
    <div class="sprite-area">
      <div class="giraffe-wrap">
        <div class="giraffe cubic-sprite"></div>
      </div>
      <div class="chest-decor">
        <img src="../../assets/icons/Treasure chest (500).png" alt="">
      </div>
    </div>
  </div>

  <script src="../../scripts/background-music.js"></script>
  <script src="../../features/shared/storage-helper.js"></script>
  <script src="../../scripts/firebase-bundle.js"></script>
  <script src="../../scripts/firebase-config.js"></script>
  <script src="../../features/progression/coins.js"></script>
  <script src="../../scripts/auth-gate.js"></script>
  <script src="store-coins.js"></script>
</body>
</html>
