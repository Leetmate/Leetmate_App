<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Home</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="../menu/nav.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="home-card">

          <div class="home-header">
            <div class="home-header-left">
              <button class="premium-btn">+ Premium</button>
            </div>
          
            <div class="home-header-center">
              <h1 class="home-title">Home</h1>
            </div>
          
            <div class="home-header-right">
              <button type="button" class="menu-btn nav-trigger" id="nav-trigger" aria-expanded="false" aria-controls="nav-drawer" aria-label="Open menu">
                <img src="../../assets/icons/menu_icon.png" class="menu-icon" alt="☰"/>
              </button>
            </div>
          </div>
        
          <div class="leetcode-card" id="leetcodeCard">
            <div class="icon-default">
              <img src="../../assets/icons/leetcode_icon.png" class="leetcode-icon" alt="LeetCode Icon"/>
            </div>
            <div class="icon-alt">
              <img src="../../assets/icons/reward_icon.png" class="leetcode-icon" alt="Reward Icon"/>
            </div>
          
            <div class="leetcode-view view-default">
              <strong>LeetCode Daily</strong>
              <span>Solve a problem to receive rewards!</span>
            </div>
            <div class="leetcode-view view-alt">
              <div class="leetcode-alt-text"> Congrats, Leetcode Daily done ✓</div>
              <strong class="leetcode-alt-strong"> </strong>
              <button type="button" class="leetcode-claim-btn" id="leetcodeClaimBtn" style="display: none;">Claim</button>
            </div>
          </div>
        
          <div class="pet-card">
            <div class="pet-name">
              <h2 id="pet-name-display">Fluffy Cat</h2>
              <p>Age: <span id="pet-age-display">--</span></p>
            </div>
            <div class="pet-top">
              <div class="coins-display">
                <div class="coins-icon">🟡</div>
                <div class="coins-amount">0</div>
              </div>
              <button type = "button" class="minimize-btn">
                <img src="../../assets/icons/minimize_icon.png" class="minimize-icon" alt="minimize"/>
              </button>
            </div>
            <div class="home-hero">
              <div class="home-hero-pet" id="active-pet"></div>
            </div>

            <!--temporary button to change the active pet-->
            <div class="pet-change">
              <button type="button" class="change-pet-test-button" id="pet-change-btn">Change Pet</button>
            </div>  

          </div>
        
          <div class="status-bar">
            <div class="status-col hearts">
              <div class="hearts-text">Happiness</div>
              <div class="hearts"><span>❤️</span><span>❤️</span><span>❤️</span><span>❤️</span><span>❤️</span></div>
            </div>
        
            <div class="status-col streak">
              <div class="streak-text">Streak</div>
              <div class="streak-display">
                <div class="streak-icon-wrap">
                  <div class="streak-icon">🔥</div>
                  <img src="../../assets/ice.png" class="streak-freeze-overlay" alt="ice">
                </div>
                <div class="streak-count">0</div>
              </div>
            </div>
        
            <div class="status-col xp">
              <div class="level-text">Lv. 1</div>
              <div class="xp-bar">
                <div class="xp-fill"></div>
                <div class="xp-text">0 / 100</div>
              </div>
              <button type="button" class="xp-test-button">+30 XP</button>
            </div>
          </div>
        </div>
      </div>

      <div class="nav-overlay" id="nav-overlay" aria-hidden="true">
        <div class="nav-drawer" id="nav-drawer" role="dialog" aria-modal="true" aria-label="Main menu">
          <button type="button" class="nav-close-btn" id="nav-close" aria-label="Close menu">×</button>
          <nav class="nav-menu" id="nav-menu">
            <button type="button" class="nav-menu-btn" id="home-btn">Home</button>
            <button type="button" class="nav-menu-btn" id="playground-btn">Playground</button>
            <button type="button" class="nav-menu-btn" id="store-btn">Store</button>
            <button type="button" class="nav-menu-btn" id="community-btn">Community</button>
            <button type="button" class="nav-menu-btn" id="activity-btn">Activity</button>
            <button type="button" class="nav-menu-btn" id="settings-btn">Settings</button>
          </nav>
        </div>
      </div>
    </div>

    <script src="../menu/nav.js"></script>
    <script src="../../js/storageHelper.js"></script>
    <script src="../../firebase-bundle.js"></script>
    <script src="../../firebase-config.js"></script>
    <script src="../../js/leetcodeUsername.js"></script>
    <script src="../../js/leetcodeProgress.js"></script>
    <script src="../../js/coins.js"></script>
    <script src="../../js/xp.js"></script>
    <script src="../../js/pet_change.js"></script>
    <script src="../../js/streak.js"></script>
    <script src="../../js/rewards.js"></script>
    <script src="home.js"></script>
    <!-- 
      REQUIRE LOGIN TO VIEW THIS SCREEN:
      Including auth-gate.js ensures only signed-in users can access this page.
      Copy these three <script> tags to the bottom of any new protected screen.
    -->
    <script src="../../scripts/auth-gate.js"></script>
  </body>
</html>
