<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Home</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="../menu/nav.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="home-card">

          <div class="home-header">
            <div class="home-header-left">
              <button class="premium-btn">+ Premium</button>
            </div>
          
            <div class="home-header-center">
              <h1 class="home-title">Home</h1>
            </div>
          
            <div class="home-header-right">
              <button type="button" class="menu-btn nav-trigger" id="nav-trigger" aria-expanded="false" aria-controls="nav-drawer" aria-label="Open menu">
                <img src="../../assets/icons/menu_icon.png" class="menu-icon" alt="☰"/>
              </button>
            </div>
          </div>
        
          <div class="leetcode-card" id="leetcodeCard">
            <img src="../../assets/icons/leetcode_icon.png" class="leetcode-icon icon-default"/>
            <img src="../../assets/icons/reward_icon.png" class="leetcode-icon icon-alt"/>

            <div class="leetcode-view view-default">
              <div> Leetcode Time, time to grind </div>
              <strong> Solve 1 Leetcode Today! </strong>
            </div>

            <div class="leetcode-view view-alt">
              <div> Congrats, Leetcode Daily done ✓</div>
              <strong> Claim Your Reward Here! </strong>
            </div>
          </div>
        
          <div class="pet-card">
        
            <div class="pet-top">
              <div> 🟡 0</div>
              <button class="minimize-btn">
                <img src="../../assets/icons/minimize_icon.png" class="minimize-icon"/>
              </button>
            </div>
        
            <div class="pet-name">
              <h2>Fluffy Cat</h2>
              <p>Age: --</p>
            </div>
        
            <div class="home-hero">
              <div class="home-hero-pet"></div>
            </div>
        
          </div>
        
          <div class="status-bar">
            <div class="status-col hearts">
              <div class="hearts-text">Happiness</div>
              <div class="hearts">❤️❤️❤️❤️❤️</div>
            </div>
        
            <div class="status-col streak">
              <div class="streak-text">Streak</div>
              <div class="streak">🔥 --</div>
            </div>
        
            <div class="status-col xp">
              <div class="level-text">Lv. 1</div>
              <div class="xp-bar">
                <div class="xp-fill"></div>
                <div class="xp-text">0 / 100</div>
              </div>
              <button type="button" class="xp-test-button">
                +30 XP
              </button>

            </div>
          </div>
        </div>
      </div>

      <div class="nav-overlay" id="nav-overlay" aria-hidden="true">
        <div class="nav-drawer" id="nav-drawer" role="dialog" aria-modal="true" aria-label="Main menu">
          <button type="button" class="nav-close-btn" id="nav-close" aria-label="Close menu">×</button>
          <nav class="nav-menu" id="nav-menu">
            <button type="button" class="nav-menu-btn">Home</button>
            <button type="button" class="nav-menu-btn">Playground</button>
            <button type="button" class="nav-menu-btn">Store</button>
            <button type="button" class="nav-menu-btn">Community</button>
            <button type="button" class="nav-menu-btn">Activity</button>
            <button type="button" class="nav-menu-btn">Settings</button>
          </nav>
        </div>
      </div>
    </div>

    <script src="../menu/nav.js"></script>
    <script src="../../firebase-bundle.js"></script>
    <script src="../../firebase-config.js"></script>
    <script src="xp.js"></script>
    <script src="home.js"></script>
  </body>
</html>
