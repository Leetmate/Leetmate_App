<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Home</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="home.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="home-card">
          <header class="home-header">
            <h1 class="home-title">Your Pet</h1>
          </header>
          <div class="home-body">
            <div class="home-hero">
              <div
                class="home-hero-pet"
                role="img"
                aria-label="Your Leetmate pet"
              ></div>
            </div>
            <p class="home-caption">
              This is a placeholder. Your Leetmate pet and stats will live here.
            </p>
          </div>
          <div class="xp-section">
            <div class="level-text">Lv. 1</div>
            <div class="xp-bar">
              <div class="xp-fill"></div>
              <div class="xp-text">0 / 100</div>
            </div>
          </div>
          <button type="button" class="xp-test-button">
            +30 XP
          </button>
        </div>
      </div>
    </div>
    <script src="xp.js"></script>
  </body>
</html>
