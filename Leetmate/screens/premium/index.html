<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../features/shared/theme-init.js"></script>
    <title>Leetmate - Premium</title>
    <link rel="stylesheet" href="../../styles/dark-theme.css" />
    <link rel="stylesheet" href="../../styles/color-theme.css" />
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="../../styles/top-banner.css" />
    <link rel="stylesheet" href="premium.css" />
    <link rel="stylesheet" href="../../styles/menu-nav.css" />
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="premium-card">
          <header class="premium-header">
            <div class="header-left">
              <button class="back-btn" id="back-btn" title="Back">
                <span class="arrow-icon"></span>
              </button>
            </div>
          
            <h1 class="premium-title">
              LeetMate<br />Premium
            </h1>
          
            <div class="header-right"></div>
          </header>

          <div class="premium-content">
            <div class="premium-info-box">
              <div class="premium-text">
                <h1 id="prem-header">Go Premium & Unlock:</h1>
                <ul>
                  <li>⚡ More XP & Coins </li>
                  <li>🎁 Bigger Milestone Rewards</li>
                  <li>🎨 Color Themes </li>
                  <li>🐾 Exclusive Pets & Accessories</li>
                </ul>
              </div>

              <button class="premium-btn" id="prem-btn">$3.99</button>
              <p id="prem-feedback" class="premium-feedback"></p>
            </div>

            <div class="premium-pet pet-left"></div>
            <div class="premium-pet pet-right"></div>
            <div class="premium-pet pet-extra pet-extra-left"></div>
            <div class="premium-pet pet-extra pet-extra-right"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../scripts/background-music.js"></script>
    <script src="../../features/shared/menu-nav.js"></script>
    <script src="../../scripts/firebase-bundle.js"></script>
    <script src="../../scripts/firebase-config.js"></script>
    <script src="../../features/progression/xp.js"></script>
    <script src="../../features/progression/streak.js"></script>
    <script src="../../scripts/auth-gate.js"></script>
    <script src="premium.js"></script>
  </body>
</html>
