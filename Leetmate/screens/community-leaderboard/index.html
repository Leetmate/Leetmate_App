<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../features/shared/theme-init.js"></script>
    <title>Leetmate - Leaderboard</title>
    <link rel="stylesheet" href="../../styles/dark-theme.css" />
    <link rel="stylesheet" href="../../styles/color-theme.css" />
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="../../styles/top-banner.css" />
    <link rel="stylesheet" href="community.css" />
    <link rel="stylesheet" href="../../styles/menu-nav.css" />
  </head>
  <body data-music-zone="community">
    <div class="popup-layout">
      <div class="popup-content">
        <div class="community-card">
          <div class="screen-banner">
            <div class="screen-banner__left">
              <button
                type="button"
                class="menu-btn"
                id="community-back-btn"
                aria-label="Back to community menu"
              >
                <img
                  src="../../assets/icons/back-arrow.png"
                  class="menu-icon"
                  alt=""
                />
              </button>
            </div>
            <div class="screen-banner__center">
              <h1 class="screen-banner__title">Leaderboard</h1>
            </div>
            <div class="screen-banner__right">
              <button
                type="button"
                class="menu-btn nav-trigger"
                id="nav-trigger"
                aria-expanded="false"
                aria-controls="nav-drawer"
                aria-label="Open menu"
              >
                <img src="../../assets/icons/menu.png" class="menu-icon" alt="" />
              </button>
            </div>
          </div>

          <div class="leaderboard-body">
            <div class="leaderboard-subheader">
              <img
                src="../../assets/icons/swords.png"
                class="leaderboard-subheader__icon"
                alt=""
                width="40"
                height="40"
              />
              <h2 class="leaderboard-subheader__title">Top Global</h2>
            </div>

            <div class="leaderboard-loading" id="leaderboard-loading" aria-live="polite">
              <span class="leaderboard-loading__dot"></span>
              <span class="leaderboard-loading__dot"></span>
              <span class="leaderboard-loading__dot"></span>
            </div>

            <ul
              class="leaderboard-list hidden"
              id="leaderboard-list"
              role="list"
              aria-label="Global leaderboard"
            ></ul>

            <div class="leaderboard-empty hidden" id="leaderboard-empty" aria-live="polite">
              <img
                src="../../assets/icons/trophy.png"
                class="leaderboard-empty__icon"
                alt=""
              />
              <p class="leaderboard-empty__text">No leaderboard data yet!</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../scripts/background-music.js"></script>
    <script src="../../features/shared/menu-nav.js"></script>
    <script src="../../scripts/firebase-bundle.js"></script>
    <script src="../../scripts/firebase-config.js"></script>
    <script src="../../features/progression/xp.js"></script>
    <script src="../../features/progression/streak.js"></script>
    <script src="../../scripts/auth-gate.js"></script>
    <script src="./community.js"></script>
  </body>
</html>
