<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Playground</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="playground.css" />
    <link rel="stylesheet" href="../menu/nav.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="playground-card">
          <div class="playground-header">
            <div class="playground-header-left">
            </div>
          
            <div class="playground-header-center">
              <h1 class="playground-title">Playground</h1>
            </div>
          
            <div class="playground-header-right">
              <button type="button" class="menu-btn nav-trigger" id="nav-trigger" aria-expanded="false" aria-controls="nav-drawer" aria-label="Open menu">☰</button>
            </div>
          </div>
          <div class="playground-content">
            <p style="color: #111; font-family: 'Lilita One', cursive; font-size: 20px;">Playground content goes here...</p>
          </div>
        </div>
      </div>

      <div class="nav-overlay" id="nav-overlay" aria-hidden="true">
        <div class="nav-drawer" id="nav-drawer" role="dialog" aria-modal="true" aria-label="Main menu">
          <button type="button" class="nav-close-btn" id="nav-close" aria-label="Close menu">×</button>
          <nav class="nav-menu" id="nav-menu">
            <button type="button" class="nav-menu-btn" id="home-btn">Home</button>
            <button type="button" class="nav-menu-btn" id="playground-btn">Playground</button>
            <button type="button" class="nav-menu-btn" id="store-btn">Store</button>
            <button type="button" class="nav-menu-btn" id="community-btn">Community</button>
            <button type="button" class="nav-menu-btn" id="activity-btn">Activity</button>
            <button type="button" class="nav-menu-btn" id="settings-btn">Settings</button>
          </nav>
        </div>
      </div>
    </div>

    <script src="../menu/nav.js"></script>
    <script src="../../firebase-bundle.js"></script>
    <script src="../../firebase-config.js"></script>
    <script src="../../js/xp.js"></script>
    <script src="../../js/streak.js"></script>
    <script src="../../scripts/auth-gate.js"></script>
  </body>
</html>
