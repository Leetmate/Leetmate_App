<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Connect Leetcode</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="leetcode.css" />
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="lc-card" id="lc-card">
          <!-- State A: Initial -->
          <section class="lc-state lc-state--initial" id="lc-state-initial">
            <header class="lc-header">
              <img
                src="LeetCode_logo.png"
                alt="LeetCode"
                class="lc-logo"
              />
              <h1 class="lc-title">Connect Your Leetcode Account</h1>
            </header>

            <div class="lc-body">
              <div class="lc-hero">
                <div
                  class="lc-hero-pet"
                  role="img"
                  aria-label="Chicken"
                ></div>
              </div>

              <button type="button" class="lc-primary-btn" id="lc-connect-btn">
                <span class="lc-btn-icon">
                  <!-- simple chain/link icon -->
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M10.5 6a1 1 0 0 1 .7.3l1 1a1 1 0 1 1-1.4 1.4l-1-1a2 2 0 0 0-2.8 2.8l1.4 1.4a1 1 0 0 1-1.4 1.4L5.6 11a4 4 0 0 1 5.7-5.7Z"
                      fill="#222"
                    />
                    <path
                      d="M13.5 18a1 1 0 0 1-.7-.3l-1-1a1 1 0 0 1 1.4-1.4l1 1a2 2 0 0 0 2.8-2.8l-1.4-1.4a1 1 0 1 1 1.4-1.4L18.4 12a4 4 0 0 1-5.7 5.7Z"
                      fill="#222"
                    />
                    <path
                      d="M9.5 13.5a1 1 0 0 1 0-1.4l5-5a1 1 0 1 1 1.4 1.4l-5 5a1 1 0 0 1-1.4 0Z"
                      fill="#222"
                    />
                  </svg>
                </span>
                <span>Sign In with Leetcode</span>
              </button>

              <p class="lc-helper">
                We&apos;ll use this to sync your daily progress
              </p>
            </div>
          </section>

          <!-- State B: Loading -->
          <section class="lc-state lc-state--loading" id="lc-state-loading">
            <header class="lc-header">
              <img
                src="LeetCode_logo.png"
                alt="LeetCode"
                class="lc-logo"
              />
              <h1 class="lc-title">Connect Your Leetcode Account</h1>
            </header>
            <div class="lc-body lc-body--center">
              <div
                class="lc-spinner"
                role="status"
                aria-live="polite"
              ></div>
              <p class="lc-text">
                Waiting to sync with your Leetcode<br />
                <span class="lc-text-sub">This may take a few seconds</span>
              </p>
            </div>
          </section>

          <!-- State C: Success -->
          <section class="lc-state lc-state--success" id="lc-state-success">
            <header class="lc-header lc-header--center">
              <h1 class="lc-title lc-title--success">Successfully Connected!</h1>
            </header>
            <div class="lc-body lc-body--center lc-success">
              <div class="lc-success-badge" aria-hidden="true">
                <svg class="lc-success-check" viewBox="0 0 24 24">
                  <path
                    d="M9.0 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"
                  ></path>
                </svg>
              </div>
              <button
                type="button"
                class="lc-primary-btn"
                id="lc-choose-pet-btn"
              >
                Choose your starter Pet
              </button>
            </div>
          </section>

          <!-- State D: Failure -->
          <section class="lc-state lc-state--failure" id="lc-state-failure">
            <header class="lc-header lc-header--center">
              <h1 class="lc-title">Failed To Connect</h1>
            </header>
            <div class="lc-body lc-body--center">
              <div class="lc-status-icon lc-status-icon--failure">✕</div>
              <p class="lc-text lc-text-error" id="lc-error-text"></p>
              <button type="button" class="lc-primary-btn" id="lc-retry-btn">
                Try Again
              </button>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="../../firebase-bundle.js"></script>
    <script src="../../firebase-config.js"></script>
    <script src="leetcode.js"></script>
  </body>
</html>
