<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate - Store</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="../../styles/top-banner.css" />
    <link rel="stylesheet" href="store.css" />
    <link rel="stylesheet" href="../../styles/menu-nav.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  </head>
  <body class="hidden-on-load">
    <div id="loading-spinner" class="spinner-container" style="display: none;">
      <div class="spinner"></div>
    </div>
    
    <div class="popup-layout">
      <div class="popup-content popup-content--scroll">
        <div class="store-card">
          <!-- Standard App Header (Ancient/Stone style) -->
          <div class="screen-banner">
            <div class="screen-banner__left">
              <div class="coins-display">
                <img src="../../assets/icons/coin.png" class="coin-icon" alt="Coins" />
                <span id="coin-count">50</span>
                <button type="button" class="add-coins-btn" id="add-coins-btn" title="Buy Coins">+</button>
              </div>
            </div>

            <div class="screen-banner__center">
              <h1 class="screen-banner__title">Store</h1>
            </div>

            <div class="screen-banner__right">
              <button
                type="button"
                class="menu-btn nav-trigger"
                id="nav-trigger"
                aria-expanded="false"
                aria-controls="nav-drawer"
                aria-label="Open menu"
              >
                <img src="../../assets/icons/menu.png" class="menu-icon" alt="" />
              </button>
            </div>
          </div>

          <div class="store-main-content">
            <!-- Promotional Banner (Scenic Park) -->
            <section class="promo-banner">
              <div class="banner-nail tl"></div>
              <div class="banner-nail tr"></div>
              <div class="banner-nail bl"></div>
              <div class="banner-nail br"></div>
              <div class="promo-content">
                <div class="banner-pet-wrap">
                  <div class="banner-pet CubicFox"></div>
                </div>
                <div class="sparkles" aria-hidden="true"></div>
                <div class="unlock-all-btn shiny-btn">
                  Unlock All<br>
									Pets & Items
                </div>
                <div class="banner-pet-wrap">
                  <div class="banner-pet CubicCat"></div>
                </div>
              </div>
            </section>

            <div class="store-scroll-area">
              <!-- Category Navigation (Ancient Stone Tabs) -->
              <nav class="category-tabs">
                <button class="tab-btn active" data-category="accessory" title="Accessory">
                  <div class="tab-icon-frame">
                     <img src="../../assets/icons/playground_closet.png" class="tab-img-main" alt="" />
                  </div>
                </button>
                <button class="tab-btn" data-category="food" title="Food">
                  <div class="tab-icon-frame">
                    <img src="../../assets/icons/Food.png" class="tab-img-main" alt="" />
                  </div>
                </button>
                <button class="tab-btn" data-category="pets" title="Pets">
                  <div class="tab-icon-frame">
                    <img src="../../assets/icons/Pet.png" class="tab-img-main" alt="" />
                  </div>
                </button>
                <button class="tab-btn" data-category="special" title="Special">
                  <div class="tab-icon-frame">
                     <img src="../../assets/icons/Special.png" class="tab-img-main" alt="" />
                  </div>
                </button>
              </nav>

              <div class="store-grid-wrap">
              <!-- Item Grid (Premium Stone Cards) -->
								<main class="store-grid">
									<div class="store-item-card">
										<div class="item-visual-box">
											<img src="../../assets/store/acc-greyhat.png" class="item-image" alt="Grey Hat" />
										</div>
										<div class="item-price-tag">
											<img src="../../assets/icons/coin.png" class="coin-mini" alt="" />
											<span>100</span>
										</div>
									</div>
									<div class="store-item-card">
										<div class="item-visual-box">
											<img src="../../assets/store/acc-brownhat.png" class="item-image" alt="Brown Hat" />
										</div>
										<div class="item-price-tag">
											<img src="../../assets/icons/coin.png" class="coin-mini" alt="" />
											<span>100</span>
										</div>
									</div>
									<div class="store-item-card">
										<div class="item-visual-box">
											<img src="../../assets/store/acc-strawhat.png" class="item-image" alt="Straw Hat" />
										</div>
										<div class="item-price-tag">
											<img src="../../assets/icons/coin.png" class="coin-mini" alt="" />
											<span>120</span>
										</div>
									</div>
									<div class="store-item-card">
										<div class="item-visual-box">
											<img src="../../assets/store/acc-tophat.png" class="item-image" alt="Top Hat" />
										</div>
										<div class="item-price-tag">
											<img src="../../assets/icons/coin.png" class="coin-mini" alt="" />
											<span>75</span>
										</div>
									</div>
								</main>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="store-modal-overlay hidden" id="store-item-modal" aria-hidden="true">
      <div class="store-modal-card" role="dialog" aria-modal="true" aria-labelledby="store-item-modal-title">
        <button type="button" class="store-modal-close" id="store-item-modal-close" aria-label="Close store item popup">×</button>

        <div class="store-modal-body">
          <div class="store-modal-top">
            <div class="store-modal-visual-box" id="store-item-modal-visual-box">
              <img src="" class="store-modal-image hidden" id="store-item-modal-image" alt="" />
              <div class="store-modal-pet-thumb hidden" id="store-item-modal-pet-thumb"></div>
            </div>

            <div class="store-modal-copy">
              <h2 class="store-modal-title" id="store-item-modal-title">Item</h2>
              <p class="store-modal-flavor hidden" id="store-item-modal-flavor"></p>
            </div>
          </div>

          <p class="store-modal-description" id="store-item-modal-description"></p>

          <button type="button" class="store-buy-btn" id="store-item-modal-buy-btn">
            <span id="store-item-modal-buy-label">Buy</span>
            <img src="../../assets/icons/coin.png" class="coin-mini" alt="" />
            <span id="store-item-modal-price-value">0</span>
          </button>
        </div>
      </div>
    </div>

    <script src="../../scripts/background-music.js"></script>
    <script src="../../features/shared/menu-nav.js"></script>
    <script src="../../features/shared/storage-helper.js"></script>
    <script src="../../scripts/firebase-bundle.js"></script>
    <script src="../../scripts/firebase-config.js"></script>
    <script src="../../features/progression/coins.js"></script>
    <script src="../../features/store/item-catalog.js"></script>
    <script src="../../features/store/item-purchase.js"></script>
    <script src="../../scripts/auth-gate.js"></script>
  <script src="store.js"></script>
  </body>
</html>
