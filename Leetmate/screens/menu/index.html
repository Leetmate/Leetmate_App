<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Menu design</title>
    <link rel="stylesheet" href="nav.css" />
  </head>
  <body>
    <div class="menu-preview">
      <div class="nav-overlay" aria-hidden="false"></div>
      <button type="button" class="nav-close-btn" aria-label="Close menu">×</button>
      <div class="nav-drawer" role="dialog" aria-label="Main menu">
        <nav class="nav-menu">
          <button type="button" class="nav-menu-btn">Home</button>
          <button type="button" class="nav-menu-btn">Playground</button>
          <button type="button" class="nav-menu-btn">Store</button>
          <button type="button" class="nav-menu-btn">Community</button>
          <button type="button" class="nav-menu-btn">Activity</button>
          <button type="button" class="nav-menu-btn">Settings</button>
        </nav>
      </div>
    </div>
  </body>
</html>
