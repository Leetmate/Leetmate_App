<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../../features/shared/theme-init.js"></script>
  <title>Pet Evolution</title>
  <link rel="stylesheet" href="../../styles/layout.css" />
  <link rel="stylesheet" href="../../styles/top-banner.css" />
  <link rel="stylesheet" href="./evolution.css" />
</head>
<body>
  <div class="evolution-screen">
    <div id="top-banner" class="screen-banner evolution-top-banner hidden">      <div class="screen-banner__left"></div>
      <div class="screen-banner__center">
        <h1 class="screen-banner__title">Your pet evolved!</h1>
      </div>
      <div class="screen-banner__right"></div>
    </div>

    <div id="evolution-dialog" class="evolution-dialog hidden" aria-live="polite">
      <div class="evolution-dialog__inner">
        <p id="evolution-dialog-text" class="evolution-dialog__text"></p>
      </div>
    </div>

    <div class="evolution-wrap">
      <div class="evolution-glow"></div>
      <div class="evolution-ring"></div>

      <div class="spark spark-lg spark-1"></div>
      <div class="spark spark-sm spark-2"></div>
      <div class="spark spark-md spark-3"></div>
      <div class="spark spark-sm spark-4"></div>
      <div class="spark spark-lg spark-5"></div>
      <div class="spark spark-md spark-6"></div>
      <div class="spark spark-sm spark-7"></div>
      <div class="spark spark-lg spark-8"></div>
      <div class="spark spark-sm spark-9"></div>
      <div class="spark spark-md spark-10"></div>

      <div class="egg-stage" id="egg-stage">
        <img id="active-pet-egg" class="home-hero-egg" alt=" " />
        <div id="active-from-pet" class="home-hero-pet evolution-from-pet hidden stage-baby"></div>
      </div>
      
      <div id="active-pet" class="home-hero-pet hidden stage-baby"></div>
    </div>

    <div id="bottom-banner" class="evolution-bottom-banner hidden">
      <button id="home-btn" class="evolution-action-btn evolution-action-btn-secondary">
        ← Return home
      </button>
      <button id="replay-btn" class="evolution-action-btn">
        <img src="../../assets/icons/replay.png" class="btn-icon" />
        Replay 
      </button>
    </div>
  </div>

  <script src="../../scripts/firebase-bundle.js"></script>
  <script src="../../scripts/firebase-config.js"></script>
  <script src="../../features/shared/storage-helper.js"></script>
  <script src="../../features/pet/evolution-notify.js"></script>
  <script src="./evolution.js"></script>
</html>
