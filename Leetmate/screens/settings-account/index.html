<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Settings – Account Information</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="../../styles/top-banner.css" />
    <link rel="stylesheet" href="account.css" />
    <link rel="stylesheet" href="../../styles/menu-nav.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="account-card">

          <div class="screen-banner">
            <div class="screen-banner__left">
              <button type="button" class="back-arrow-btn" id="back-btn">←</button>
            </div>

            <div class="screen-banner__center">
              <h1 class="screen-banner__title account-title-main">Account Info</h1>
            </div>
            
            <div class="screen-banner__right">
              <button
                type="button"
                class="menu-btn nav-trigger"
                id="nav-trigger"
                aria-expanded="false"
                aria-controls="nav-drawer"
                aria-label="Open menu">
                <img src="../../assets/icons/menu.png" class="menu-icon" alt="" />
              </button>          
            </div>
          </div>

          <div class="account-content">
            <div class="profile-section" id="profile-click">
              <div class="profile-avatar"></div>
              <div class="username">USERNAME_001 ✏️</div>
              <p class="email">example@gmail.com</p>
            </div>
            <div class="accordion">

              <!-- Change email section -->
              <div class="accordion-item">
                <button class="accordion-header">
                  Update Email
                  <span class="arrow">▾</span>
                </button>
            
                <div class="accordion-content">
                  <input class="input" placeholder="New Email Address" />
                  <button class="update-btn">Update Email</button>
                </div>
              </div>
            
              <!-- Change password section -->
              <div class="accordion-item">
                <button class="accordion-header">
                  Change Password
                  <span class="arrow">▾</span>
                </button>
            
                <div class="accordion-content">
                  <input class="input" type="password" placeholder="New Password" />
                  <input class="input" type="password" placeholder="Confirm Password" />
                  <button class="update-btn">Update Password</button>
                </div>
              </div>
            </div>

            <!-- Delete account section -->
            <div class="danger-zone">
              <div class="danger-header">
                Danger Zone
              </div>

              <button class="delete-btn">
                Delete Account
              </button>
            </div>
        </div>
      </div>
    </div>

    <script src="../../features/shared/menu-nav.js"></script>
    <script src="../../scripts/firebase-bundle.js"></script>
    <script src="../../scripts/firebase-config.js"></script>
    <script src="../../features/progression/xp.js"></script>
    <script src="../../features/progression/streak.js"></script>
    <script src="../../features/shared/storage-helper.js"></script>
    <script src="../../scripts/auth-gate.js"></script>  
    <script src="account.js"></script>
  </body>
</html>
