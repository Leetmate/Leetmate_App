<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Settings – Account Information</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="../../styles/top-banner.css" />
    <link rel="stylesheet" href="account.css" />
    <link rel="stylesheet" href="../../styles/menu-nav.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="account-card">
          <div class="screen-banner">
            <div class="screen-banner__left">
              <button type="button" class="back-arrow-btn" id="back-btn">←</button>
            </div>

            <div class="screen-banner__center">
              <h1 class="screen-banner__title account-title-main">Account Info</h1>
            </div>

            <div class="screen-banner__right">
              <button
                type="button"
                class="menu-btn nav-trigger"
                id="nav-trigger"
                aria-expanded="false"
                aria-controls="nav-drawer"
                aria-label="Open menu"
              >
                <img src="../../assets/icons/menu.png" class="menu-icon" alt="" />
              </button>
            </div>
          </div>

          <div class="account-content">
            <div class="profile-section">
              <button
                type="button"
                class="profile-avatar-btn"
                id="profile-avatar-btn"
                aria-label="Change profile color"
              >
                <div class="profile-avatar" id="profile-avatar">
                  <img src="../../assets/icons/Pet.png" alt="Placeholder Image of Pet" class="clip-avatar adult" id="avatar_img">
                </div>
              </button>

              <button
                type="button"
                class="username-btn"
                id="username-btn"
                aria-label="Change username"
              >
                <span class="username" id="username-display">Loading...</span>
              </button>

              <p class="email" id="email-display">Loading...</p>
            </div>

            <div class="accordion">
              <div class="accordion-item">
                <button type="button" class="accordion-header">
                  Update Email
                  <span class="arrow">▾</span>
                </button>

                <div class="accordion-content">
                  <input
                    class="input"
                    id="current-password-email"
                    type="password"
                    placeholder="Current Password"
                    autocomplete="current-password"
                  />
                  <input
                    class="input"
                    id="new-email"
                    type="email"
                    placeholder="New Email Address"
                    autocomplete="email"
                  />
                  <button type="button" class="update-btn" id="update-email-btn">
                    Update Email
                  </button>
                </div>
              </div>

              <div class="accordion-item">
                <button type="button" class="accordion-header">
                  Change Password
                  <span class="arrow">▾</span>
                </button>

                <div class="accordion-content">
                  <input
                    class="input"
                    id="current-password-password"
                    type="password"
                    placeholder="Current Password"
                    autocomplete="current-password"
                  />
                  <input
                    class="input"
                    id="new-password"
                    type="password"
                    placeholder="New Password"
                    autocomplete="new-password"
                  />
                  <input
                    class="input"
                    id="confirm-password"
                    type="password"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                  />
                  <button type="button" class="update-btn" id="update-password-btn">
                    Update Password
                  </button>
                </div>
              </div>
            </div>

            <div class="danger-zone">
              <div class="danger-header">Danger Zone</div>

              <button type="button" class="delete-btn" id="delete-btn">
                Delete Account
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Username modal -->
    <div class="username-modal hidden" id="username-modal">
      <div
        class="username-modal__overlay"
        id="username-modal-overlay"
        aria-hidden="true"
      ></div>

      <div
        class="username-modal__card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="username-modal-title"
      >
        <h2 id="username-modal-title" class="username-modal__title">
          Change Username
        </h2>

        <input
          class="input"
          id="username-input"
          type="text"
          placeholder="Enter new username"
          maxlength="20"
          autocomplete="username"
        />

        <div class="username-modal__actions">
          <button type="button" class="cancel-btn" id="cancel-username-btn">
            Cancel
          </button>
          <button type="button" class="update-btn" id="save-username-btn">
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Delete Account Modal -->
     <div class="delete-modal hidden" id="delete-modal">
      <div class="delete-modal__overlay" id="delete_modal__overlay" aria-hidden="true"></div>
      <div class="delete-modal__card" role="dialogue" aria-modal="true" aria-labelledby="delete-modal-title">
        <h2 id="delete-modal-title" class="delete_modal__title">
          Are you sure you want to delete your account? This action cannot be undone.
        </h2>
        
        <div class="username-modal__actions">
          <button type="button" class="cancel-delete-btn" id="cancel-delete-btn">
            Cancel
          </button>
          <button type="button" class="confirm-delete-btn" id="confirm-delete-btn">
            Delete
          </button>
      </div>
      
     </div>

    <script src="../../features/shared/menu-nav.js"></script>
    <script src="../../scripts/firebase-bundle.js"></script>
    <script src="../../scripts/firebase-config.js"></script>
    <script src="../../features/progression/xp.js"></script>
    <script src="../../features/progression/streak.js"></script>
    <script src="../../features/shared/storage-helper.js"></script>
    <script src="../../scripts/auth-gate.js"></script>
    <script src="../../features/pet/pet-loader.js"></script>
    <script src="account.js"></script>
  </body>
</html>
