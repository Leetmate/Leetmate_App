<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leetmate – Settings – Account Information</title>
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="account.css" />
    <link rel="stylesheet" href="../../styles/menu-nav.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="popup-layout">
      <div class="popup-content">
        <div class="account-card">
          <div class="account-header">
            <button type="button" class="back-btn" id="back-btn">←</button>
            <h1 class="account-title-main">Account Info</h1>
            <button
              type="button"
              class="menu-btn nav-trigger"
              id="nav-trigger"
              aria-expanded="false"
              aria-controls="nav-drawer"
              aria-label="Open menu">
            <img src="../../assets/icons/menu.png" class="menu-icon" alt="" />
            </button>          
          </div>
            
          <div class="account-content">
            <div class="form-section">
              <div class="profile-row" id="profile-click">
                <div class="profile-avatar"></div>
                <div class="profile-info">
                  <div class="username">USERNAME_001 ✏️</div>
                  <p class="email">Example@gmail.com</p>
                </div>
              </div>
  
              <input class="input" id="update-email" name="update-email" placeholder="Update Email Address" value="" />
              <input class="input" type="password" placeholder="New Password" />
              <input class="input" type="password" placeholder="Confirm New Password" />
            </div>
  
            <div class="action-section">
              <button class="account-btn-primary" id="submit-updates" name="update-email">Update</button>
              <button class="account-btn-primary account-btn-danger">Delete Account</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../features/shared/menu-nav.js"></script>
    <script src="../../scripts/firebase-bundle.js"></script>
    <script src="../../scripts/firebase-config.js"></script>
    <script src="../../features/progression/xp.js"></script>
    <script src="../../features/progression/streak.js"></script>
    <script src="../../features/shared/storage-helper.js"></script>
    <script src="../../scripts/auth-gate.js"></script>  
    <script src="account.js"></script>
  </body>
</html>
