<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../features/shared/theme-init.js"></script>
    <title>Leetmate - Community</title>
    <link rel="stylesheet" href="../../styles/dark-theme.css" />
    <link rel="stylesheet" href="../../styles/color-theme.css">
    <link rel="stylesheet" href="../../styles/layout.css" />
    <link rel="stylesheet" href="../../styles/top-banner.css" />
    <link rel="stylesheet" href="community.css" />
    <link rel="stylesheet" href="../../styles/menu-nav.css" />
  </head>
  <body data-music-zone="community">
    <div class="popup-layout">
      <div class="popup-content">
        <div class="community-card">
          <div class="screen-banner">
            <div class="screen-banner__left"></div>
            <div class="screen-banner__center">
              <h1 class="screen-banner__title">Community</h1>
            </div>
            <div class="screen-banner__right">
              <button
                type="button"
                class="menu-btn nav-trigger"
                id="nav-trigger"
                aria-expanded="false"
                aria-controls="nav-drawer"
                aria-label="Open menu"
              >
                <img src="../../assets/icons/menu.png" class="menu-icon" alt="" />
              </button>
            </div>
          </div>

          <div class="community-content">
            <div class="community-menu" role="navigation" aria-label="Community sections">
              <button
                type="button"
                class="community-menu-btn"
                id="multiplayer-btn"
              >
                <img
                  src="../../assets/icons/swords.png"
                  class="community-menu-btn__icon"
                  alt=""
                />
                <span class="community-menu-btn__label">Multiplayer</span>
              </button>

              <button
                type="button"
                class="community-menu-btn"
                id="leaderboard-btn"
              >
                <img
                  src="../../assets/icons/trophy.png"
                  class="community-menu-btn__icon"
                  alt=""
                />
                <span class="community-menu-btn__label">Leaderboard</span>
              </button>

              <button
                type="button"
                class="community-menu-btn"
                id="friends-btn"
              >
                <img
                  src="../../assets/icons/friends.png"
                  class="community-menu-btn__icon"
                  alt=""
                />
                <span class="community-menu-btn__label">Friends</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../scripts/background-music.js"></script>
    <script src="../../features/shared/menu-nav.js"></script>
    <script src="../../scripts/firebase-bundle.js"></script>
    <script src="../../scripts/firebase-config.js"></script>
    <script src="../../features/progression/xp.js"></script>
    <script src="../../features/progression/streak.js"></script>
    <script src="../../scripts/auth-gate.js"></script>
    <script src="./community.js"></script>
  </body>
</html>
